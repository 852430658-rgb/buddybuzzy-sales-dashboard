    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #17212b;
        background:
          linear-gradient(180deg, rgba(22,135,125,.06), transparent 280px),
          #f3f6f7;
        font-family: "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;
      }
      .login-card {
        width: min(420px, 100%);
        padding: 30px;
        background: #fff;
        border: 1px solid #dfe5e8;
        border-radius: 8px;
        box-shadow: 0 18px 50px rgba(23,50,77,.10);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 13px;
        margin-bottom: 26px;
      }
      .brand-mark {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        color: #fff;
        background: #17324d;
        border-radius: 10px;
        font-size: 19px;
        font-weight: 800;
      }
      .eyebrow {
        margin: 0 0 3px;
        color: #16877d;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      h1 { margin: 0; font-size: 23px; line-height: 1.25; }
      p { margin: 0; color: #68737f; font-size: 13px; line-height: 1.7; }
      form { display: grid; gap: 11px; margin-top: 24px; }
      label { color: #68737f; font-size: 12px; font-weight: 700; }
      input {
        width: 100%;
        height: 44px;
        padding: 0 13px;
        color: #17212b;
        background: #fff;
        border: 1px solid #dfe5e8;
        border-radius: 7px;
        outline: none;
        font: inherit;
      }
      input:focus {
        border-color: #16877d;
        box-shadow: 0 0 0 3px rgba(22,135,125,.10);
      }
      button {
        height: 44px;
        margin-top: 4px;
        color: #fff;
        background: #17324d;
        border: 0;
        border-radius: 7px;
        cursor: pointer;
        font: inherit;
        font-weight: 750;
      }
      button:disabled { cursor: wait; opacity: .65; }
      .message {
        min-height: 20px;
        margin-top: 12px;
        color: #e0644a;
        font-size: 12px;
      }
    </style>

      async function deriveKey(username, password) {
        const material = await crypto.subtle.importKey(
          "raw",
          new TextEncoder().encode(username + "\n" + password),
          "PBKDF2",
          false,
          ["deriveKey"],

          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"],

          );
          sessionStorage.setItem("mall_dashboard_account", username);
          sessionStorage.setItem("mall_dashboard_password", password);
          document.open();
          document.write(new TextDecoder().decode(decrypted));
          document.close();
        } catch {
          sessionStorage.removeItem("mall_dashboard_account");
          sessionStorage.removeItem("mall_dashboard_password");
          message.textContent = "账号或密码不正确";
          button.disabled = false;
          input.select();
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        unlock(accountInput.value.trim(), input.value);
      });

      const savedAccount = sessionStorage.getItem("mall_dashboard_account");
      const savedPassword = sessionStorage.getItem("mall_dashboard_password");
      if (savedAccount && savedPassword) unlock(savedAccount, savedPassword);
    </script>
  </body>
</html>
